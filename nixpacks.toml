[phases.setup]
nixPkgs = [
    "python311",
    "python311Packages.pip",
    "cairo",
    "pango",
    "gdk-pixbuf",
    "libffi",
    "pkg-config",
    "gcc"
]

[phases.install]
cmds = [
    "export PKG_CONFIG_PATH=$PKG_CONFIG_PATH:/root/.nix-profile/lib/pkgconfig",
    "pip install -r requirements.txt --break-system-packages"
]

[start]
cmd = "python bot.py"

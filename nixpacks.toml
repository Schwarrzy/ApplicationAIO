[phases.setup]
# Ajout explicite de reportlab pour corriger l'erreur du log 15:09
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.xhtml2pdf", "python311Packages.reportlab", "cairo", "pkg-config", "gcc"]

[phases.install]
# On garde cette méthode car elle fonctionnait pour détecter xhtml2pdf
cmds = ["python3 -m venv /opt/venv --system-site-packages && . /opt/venv/bin/activate && pip install -r requirements.txt"]

[start]
cmd = ". /opt/venv/bin/activate && python bot.py"

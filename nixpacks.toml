[phases.setup]
# On garde uniquement les outils système (pas de paquets python ici à part pip)
nixPkgs = ["python311", "python311Packages.pip", "cairo", "pkg-config", "gobject-introspection", "gcc", "zlib"]

[phases.install]
# C'est la ligne MAGIQUE : On dit à Pip où trouver Cairo, puis on installe TOUT via Pip
cmds = ["export PKG_CONFIG_PATH=$(find /nix/store -name pkgconfig -type d | paste -sd ':' -) && pip install -r requirements.txt --break-system-packages"]

[start]
cmd = "python3 bot.py"

[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "cairo", "pkg-config", "gobject-introspection", "gcc"]

[phases.install]
cmds = ["/root/.nix-profile/bin/python3 -m pip install --upgrade pip --break-system-packages && /root/.nix-profile/bin/python3 -m pip install -r requirements.txt --break-system-packages"]

[start]
cmd = "/root/.nix-profile/bin/python3 bot.py"

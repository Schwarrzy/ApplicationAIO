[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "cairo", "pkg-config", "gobject-introspection", "gcc"]

[phases.install]
cmds = [
    "pip install --upgrade pip --break-system-packages",
    "pip install -r requirements.txt --break-system-packages"
]

[start]
cmd = "python3 bot.py"
